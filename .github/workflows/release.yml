name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_PROJECT: src/vTorrent.Desktop/vTorrent.Desktop.csproj

jobs:
  build:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,     archive: zip, tfm: net10.0-windows10.0.17763.0 }
          - { os: ubuntu-latest,  rid: linux-x64,   archive: tar, tfm: net10.0 }
          - { os: ubuntu-latest,  rid: linux-arm64, archive: tar, tfm: net10.0 }
          - { os: macos-latest,   rid: osx-x64,     archive: tar, tfm: net10.0 }
          - { os: macos-latest,   rid: osx-arm64,   archive: tar, tfm: net10.0 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (${{ matrix.rid }})
        shell: bash
        run: |
          dotnet publish "$APP_PROJECT" \
            -c Release \
            -f ${{ matrix.tfm }} \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o "publish/${{ matrix.rid }}"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          tar -czf "vTorrent-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz" \
            -C "publish/${{ matrix.rid }}" .

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" `
            -DestinationPath "vTorrent-${{ github.ref_name }}-${{ matrix.rid }}.zip"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            vTorrent-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz
            vTorrent-${{ github.ref_name }}-${{ matrix.rid }}.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
